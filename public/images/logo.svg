<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 64" width="280" height="64">
  <defs>
    <linearGradient id="fullJwtBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#181D28"/>
      <stop offset="100%" stop-color="#0B0D12"/>
    </linearGradient>
    <linearGradient id="fullJwtOrange" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFA06E"/>
      <stop offset="50%" stop-color="#FF6B2C"/>
      <stop offset="100%" stop-color="#E55315"/>
    </linearGradient>
    <linearGradient id="fullJwtTeal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#55EFC4"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>
    <filter id="fullGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#FF6B2C" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Left Icon Mark (64x64 container, scaled to 48x48 positioned at 0, 8) -->
  <g transform="translate(0, 8) scale(0.75)">
    <rect width="64" height="64" rx="16" fill="url(#fullJwtBg)"/>
    <rect x="1" y="1" width="62" height="62" rx="15" fill="none" stroke="#2B3242" stroke-width="1.2"/>
    <path d="M22 23 L14 31 L22 39" fill="none" stroke="url(#fullJwtTeal)" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M43 17 L43 37 C43 44.5 37.5 49 30 49 C24 49 19.5 45.5 17.5 41" fill="none" stroke="url(#fullJwtOrange)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" filter="url(#fullGlow)"/>
    <circle cx="43" cy="17" r="3.2" fill="#FFFFFF"/>
  </g>

  <!-- Wordmark Typography -->
  <!-- "Jhala" in Clean Primary White/Deep Ink -->
  <text x="60" y="36" font-family="'Space Grotesk', system-ui, -apple-system, sans-serif" font-size="22" font-weight="700" fill="#FFFFFF" letter-spacing="-0.5">
    Jhala<tspan fill="#FF6B2C">WebTech</tspan>
  </text>

  <!-- Subtitle Tagline in JetBrains Mono -->
  <text x="61" y="49" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="600" fill="#9AA3B2" letter-spacing="1.5">
    WEB • MOBILE • CLOUD
  </text>
</svg>